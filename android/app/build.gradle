plugins { id 'com.android.application' }

def keyFile = System.getenv('RADIOHITS_KEYSTORE_FILE')
def keyPassword = System.getenv('RADIOHITS_KEYSTORE_PASSWORD')
def keyAlias = System.getenv('RADIOHITS_KEY_ALIAS')
def aliasPassword = System.getenv('RADIOHITS_KEY_PASSWORD')
def releaseReady = keyFile && keyPassword && keyAlias && aliasPassword

android {
  namespace 'br.com.radiohits.app'
  compileSdk 36
  defaultConfig {
    applicationId 'br.com.radiohits.app'
    minSdk 26
    targetSdk 35
    versionCode 14
    versionName '2.3'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  signingConfigs {
    release {
      if (releaseReady) {
        storeFile file(keyFile)
        storePassword keyPassword
        keyAlias keyAlias
        keyPassword aliasPassword
      }
    }
  }
  buildTypes {
    release {
      minifyEnabled false
      if (releaseReady) signingConfig signingConfigs.release
    }
  }
}
dependencies {
  def media3 = '1.11.1'
  implementation "androidx.media3:media3-exoplayer:$media3"
  implementation "androidx.media3:media3-session:$media3"
  implementation 'androidx.webkit:webkit:1.14.0'
  implementation 'androidx.work:work-runtime:2.12.0'
}
