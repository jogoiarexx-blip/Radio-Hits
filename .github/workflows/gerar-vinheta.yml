name: Gerar vinheta Radio Hits (voz pt-BR)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/gerar_vinheta.py'
      - '.github/workflows/gerar-vinheta.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gerar-vinheta-radio-hits
  cancel-in-progress: false
jobs:
  gerar-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar sintetizador e ferramentas
        run: |
          python -m pip install --disable-pip-version-check edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Gerar vinheta original de locucao brasileira
        run: python scripts/gerar_vinheta.py
      - name: Testar MP3 de locucao
        run: |
          test -s vinhetas/radio-hits-cada-5.mp3
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 vinhetas/radio-hits-cada-5.mp3
      - name: Versionar áudio resultante
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git pull --rebase origin main
            git add vinhetas/radio-hits-cada-5.mp3
            if git diff --cached --quiet; then
              echo "Audio nao mudou."
              exit 0
            fi
            git commit -m "Adicionar vinheta original em portugues com locucao neural"
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
