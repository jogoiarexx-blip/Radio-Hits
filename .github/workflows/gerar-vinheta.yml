name: Gerar vinheta Radio Hits (voz pt-BR)
on:
  pull_request:
    paths:
      - 'scripts/gerar_vinheta.py'
      - 'tests/test_vinheta_audio.py'
      - 'scripts/gerar_catalogo.py'
      - 'tests/teste-vinheta.js'
      - '.github/workflows/gerar-vinheta.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/gerar_vinheta.py'
      - '.github/workflows/gerar-vinheta.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: gerar-vinheta-radio-hits
  cancel-in-progress: false
jobs:
  gerar-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar sintetizador e ferramentas
        run: |
          python -m pip install --disable-pip-version-check 'edge-tts>=7,<9' 'numpy>=2,<3'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Gerar vinheta original de locucao brasileira
        run: python scripts/gerar_vinheta.py
      - name: Validar vinheta feminina, batida musical e dinâmica do áudio
        run: |
          python tests/test_vinheta_audio.py
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=noprint_wrappers=1 vinhetas/radio-hits-cada-5.mp3
      - name: Versionar áudio resultante
        if: github.event_name != 'pull_request'
        id: publish_audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Guardar o áudio aprovado fora do checkout antes de sincronizar.
          # MP3 é binário: nunca usar rebase sobre dois MP3 diferentes.
          mkdir -p "$RUNNER_TEMP/vinhetas"
          cp vinhetas/radio-hits-cada-5.mp3 vinhetas/radio-hits-alto-astral.mp3 vinhetas/radio-hits-classicos.mp3 "$RUNNER_TEMP/vinhetas/"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p vinhetas
            cp "$RUNNER_TEMP/vinhetas/"*.mp3 vinhetas/
            git add vinhetas/radio-hits-cada-5.mp3 vinhetas/radio-hits-alto-astral.mp3 vinhetas/radio-hits-classicos.mp3
            if git diff --cached --quiet; then
              echo "Audio ja esta atualizado."
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Atualizar as tres vinhetas femininas originais do Radio Hits"
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Novo commit concorrente no main; tentando novamente ($attempt/5)"
            sleep 4
          done
          exit 1
      - name: Reconstruir catálogo, site e APK com a nova duração
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commits feitos com GITHUB_TOKEN não disparam outros workflows
          # automaticamente: a publicação precisa ser acionada explicitamente.
          gh workflow run publicar.yml --ref main
          gh workflow run android-apk.yml --ref main
