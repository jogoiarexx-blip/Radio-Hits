name: Gerar APK Android Radio Hits
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'vinhetas/**'
      - 'index.html'
      - 'catalogo.json'
      - 'musicas/Summer EletroHits/**'
      - 'tests/test_summer_eletrohits.py'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tests/teste-bridge-android.js'
      - 'tests/teste-backup-biblioteca.js'
      - 'tests/teste-vinil.js'
      - 'tests/teste-pwa-instalacao.js'
      - 'tests/teste-sleep-timer.js'
      - 'js/sleep-timer.js'
      - 'tests/teste-fila-android.js'
      - 'tests/teste-recuperacao-android.js'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'vinhetas/**'
      - 'index.html'
      - 'catalogo.json'
      - 'sw.js'
      - 'tests/teste-vinil.js'
      - 'tests/teste-pwa-instalacao.js'
      - 'tests/teste-sleep-timer.js'
      - 'js/sleep-timer.js'
      - 'tests/teste-fila-android.js'
      - 'tests/teste-recuperacao-android.js'
      - '.github/workflows/android-apk.yml'
      - 'tests/teste-vinil.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar API 36 com SDK preinstalado
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Preparar vinhetas no PR se ainda nao versionadas
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -s vinhetas/radio-hits-alto-astral.mp3 ] || [ ! -s vinhetas/radio-hits-classicos.mp3 ]; then
            python -m pip install --disable-pip-version-check 'edge-tts>=7,<9' 'numpy>=2,<3'
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            python scripts/gerar_vinheta.py
            python tests/test_vinheta_audio.py
          fi
      - name: Regenerar catalogo com vinhetas
        run: |
          python -m pip install --disable-pip-version-check mutagen==1.47.0
          python scripts/gerar_catalogo.py
      - name: Validar ponte, interface e catalogo
        run: |
          node --check js/native-bridge.js
          node --check js/offline.js
          node --check js/app.js
          node tests/teste-bridge-android.js
          node tests/teste-fila-android.js
          node tests/teste-recuperacao-android.js
          python tests/test_programacao.py
          python tests/test_audio_leve.py
          node tests/teste-economia-dados.js
          python tests/test_summer_eletrohits.py
          python tests/test_musicas_desativadas.py
          node tests/teste-radio-64.js
          node tests/teste-grade-atualizacao.js
          node tests/teste-vinheta.js
          node tests/teste-explorar-pastas.js
          node tests/teste-backup-biblioteca.js
          node tests/teste-vinil.js
          node tests/teste-pwa-instalacao.js
          node tests/teste-sleep-timer.js
          node tests/teste-bateria-background.js
          node tests/teste-memoria-stream.js
          javac -d /tmp/radiohits-recovery android/app/src/main/java/br/com/radiohits/app/PlaybackClock.java android/app/src/main/java/br/com/radiohits/app/PlaybackRetryPolicy.java tests/PlaybackRecoveryCheck.java
          java -cp /tmp/radiohits-recovery br.com.radiohits.app.PlaybackRecoveryCheck
          javac -d /tmp/radiohits-recovery android/app/src/main/java/br/com/radiohits/app/SleepTimerClock.java tests/SleepTimerCheck.java
          java -cp /tmp/radiohits-recovery br.com.radiohits.app.SleepTimerCheck
          node tests/auditoria-radio.js
          node tests/teste-volume.js
          node tests/teste-transicoes.js
          node tests/teste-download-ui.js
          node tests/teste-download-real.js
      - name: Embutir interface e catalogo offline
        run: |
          mkdir -p android/app/src/main/assets/offline-site
          cp index.html catalogo.json manifest.webmanifest sw.js android/app/src/main/assets/offline-site/
          cp -R css js assets vinhetas android/app/src/main/assets/offline-site/
      - name: Compilar APK para teste
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Disponibilizar APK de teste (nao atualiza release)
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Hits-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Verificar disponibilidade de assinatura release
        if: github.event_name != 'pull_request'
        env:
          STORE_BASE64: ${{ secrets.RADIOHITS_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RADIOHITS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RADIOHITS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RADIOHITS_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$STORE_BASE64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radiohits-release.jks"
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
            echo "RADIOHITS_KEYSTORE_FILE=$RUNNER_TEMP/radiohits-release.jks" >> "$GITHUB_ENV"
          else
            echo "Assinatura release ausente: APK debug gerado; release NAO sera distribuido." >> "$GITHUB_STEP_SUMMARY"
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK release assinado
        if: env.HAS_RELEASE_SIGNING == 'true'
        working-directory: android
        env:
          RADIOHITS_KEYSTORE_PASSWORD: ${{ secrets.RADIOHITS_KEYSTORE_PASSWORD }}
          RADIOHITS_KEY_ALIAS: ${{ secrets.RADIOHITS_KEY_ALIAS }}
          RADIOHITS_KEY_PASSWORD: ${{ secrets.RADIOHITS_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Gerar checksum do APK release
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Disponibilizar APK release e checksum
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Hits-Android-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: Apagar keystore temporaria
        if: always()
        run: rm -f "$RUNNER_TEMP/radiohits-release.jks"
