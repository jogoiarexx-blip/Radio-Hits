name: Organizar músicas novas por estilo
on:
  push:
    branches: [main]
    paths:
      - '*.mp3'
      - '*.m4a'
      - '*.ogg'
      - '*.opus'
      - '*.wav'
      - '*.flac'
      - '*.aac'
      - 'musicas/novas-do-rar/**'
      - 'musicas/*.mp3'
      - 'musicas/*.m4a'
      - 'musicas/*.ogg'
      - 'musicas/*.opus'
      - 'musicas/*.wav'
      - 'musicas/*.flac'
      - 'musicas/*.aac'
      - 'scripts/verificar_catalogo.py'
      - 'scripts/gerar_catalogo.py'
      - 'tests/teste-explorar-pastas.js'
      - 'tests/test_musicas_desativadas.py'
      - 'musicas/metadados.json'
      - 'scripts/organizar_novas.py'
      - 'tests/test_organizar_novas.py'
      - '.github/workflows/organizar-novas.yml'
  pull_request:
    paths:
      - 'tests/teste-radio-64.js'
      - 'tests/teste-memoria-stream.js'
      - 'scripts/organizar_novas.py'
      - 'tests/test_organizar_novas.py'
      - 'tests/test_programacao.py'
      - 'scripts/programar_radio.py'
      - '.github/workflows/organizar-novas.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: organizar-novas-do-rar
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar regras e movimentar uploads na cópia de testes
        run: |
          python tests/test_organizar_novas.py
          python scripts/organizar_novas.py
      - name: Validar programação
        run: |
          python tests/test_programacao.py
      - name: Certificar a nova grade com os MP3 reais (antes de publicar)
        run: |
          python -m pip install --disable-pip-version-check mutagen==1.47.0
          python scripts/gerar_catalogo.py
          python scripts/verificar_catalogo.py
          node tests/teste-vinheta.js
          node tests/teste-explorar-pastas.js
      - name: Validar rádio e downloads com catálogo crescente
        run: |
          node tests/teste-radio-64.js
          node tests/teste-grade-atualizacao.js
          node tests/teste-memoria-stream.js
  organizar:
    if: github.event_name != 'pull_request'
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Obter main atual
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Transferir músicas e preservar metadados
        id: move
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/organizar_novas.py | tee organizar-resultado.txt
            # Incluir remoções de uploads da raiz junto com as novas pastas.
            git add -A -- musicas/
            # Inclui as exclusões dos MP3/M4A da raiz sem exigir que todas as extensões existam.
            git add -u -- .
            if git diff --cached --quiet; then
              echo "Nenhum arquivo novo para mover."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Organizar novas musicas por estilo e atualizar metadados"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Main recebeu novos uploads; atualizando e tentando novamente ($attempt/5)."
            sleep 3
          done
          echo "Nao foi possivel atualizar main sem conflitos." >&2
          exit 1
      - name: Atualizar site e APK com caminhos definitivos
        if: steps.move.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publicar.yml --ref main
          gh workflow run android-apk.yml --ref main
