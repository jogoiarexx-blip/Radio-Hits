name: Publicar Radio Hits no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar leitor de audio
        run: python -m pip install --disable-pip-version-check mutagen==1.47.0
      - name: Gerar catalogo e site
        run: python scripts/preparar_site.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
