name: Publicar Radio Hits no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar leitor de audio
        run: python -m pip install --disable-pip-version-check mutagen==1.47.0
      - name: Verificar JavaScript do player e offline
        run: |
          node --check js/app.js
          node --check js/offline.js
          node tests/auditoria-radio.js
          node tests/teste-transicoes.js
      - name: Gerar catalogo e site
        run: python scripts/preparar_site.py
      - name: Conferir todas as musicas adicionadas
        run: python scripts/verificar_catalogo.py
      - name: Validar SVGs e capas
        run: python scripts/verificar_assets.py
      - name: Manter o catalogo.json atualizado na branch main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          if git diff --cached --quiet; then
            echo "Catalogo ja atualizado no repositorio."
          else
            git commit -m "Atualizar catalogo de musicas automaticamente"
            git push
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
